<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>بينغ بونغ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بينغ بونغ">
<meta name="theme-color" content="#0e0f13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0e0f13;
    --panel: #181a21;
    --line: #2a2d38;
    --text: #f4f4f6;
    --muted: #8b8f9c;
    --a: #ff7a2f;
    --b: #2fd3c0;
    --gold: #ffd166;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Arabic", "Geeza Pro", system-ui, sans-serif;
    overscroll-behavior: none; touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  /* The two players of the current match, stacked in portrait, side by side in landscape. */
  #court { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px; min-height: 0; }
  @media (orientation: landscape) { #court { flex-direction: row; } }

  .side {
    flex: 1; min-height: 0; border-radius: 24px; background: var(--panel);
    border: 2px solid var(--line); display: flex; flex-direction: column;
    padding: 14px; gap: 12px; position: relative; overflow: hidden;
  }
  .side[data-slot="0"] { --c: var(--a); }
  .side[data-slot="1"] { --c: var(--b); }

  .who { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .name {
    font-size: 24px; font-weight: 800; color: var(--c);
    display: flex; align-items: center; gap: 6px; padding: 4px 2px; min-width: 0;
  }
  .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name small { font-size: 14px; color: var(--muted); }
  .cups { color: var(--gold); font-weight: 800; font-size: 20px; white-space: nowrap; }

  .progress { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
  .row .label { width: 64px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); }
  .dot.on { background: var(--c); border-color: var(--c); }
  .star { font-size: 26px; line-height: 1; color: var(--line); }
  .star.on { color: var(--gold); }

  .win {
    flex: 1; min-height: 64px; border-radius: 18px; font-size: 26px; font-weight: 800;
    background: var(--c); color: #111; display: flex; align-items: center; justify-content: center;
    transition: transform .08s ease, filter .08s ease;
  }
  .win:active { transform: scale(.97); filter: brightness(.9); }

  #bar { display: flex; gap: 8px; padding: 0 8px 8px; }
  #bar button {
    flex: 1; height: 60px; border-radius: 18px; background: var(--panel);
    border: 2px solid var(--line); font-size: 18px; font-weight: 700;
  }
  #bar button:active { background: var(--line); }
  #undo:disabled { opacity: .35; }

  /* Toast for a plain game win, so the next game can start straight away. */
  #toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 16px); z-index: 20;
    transform: translate(-50%, -150%); transition: transform .25s ease;
    background: var(--text); color: var(--bg); font-weight: 800; font-size: 18px;
    padding: 12px 20px; border-radius: 999px; white-space: nowrap;
  }
  #toast.show { transform: translate(-50%, 0); }

  .overlay {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(8, 9, 12, .82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .overlay.show { display: flex; }
  .card {
    width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto;
    background: var(--panel); border: 2px solid var(--line);
    border-radius: 28px; padding: 24px 18px; text-align: center;
  }
  .card h2 { margin: 4px 0 8px; font-size: 26px; }
  .card p { margin: 4px 0 16px; color: var(--muted); font-size: 16px; }
  .big-emoji { font-size: 64px; }
  .btn {
    width: 100%; min-height: 56px; border-radius: 16px; font-size: 18px; font-weight: 700;
    background: var(--bg); border: 2px solid var(--line); margin-top: 8px; padding: 8px 14px;
  }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.danger { color: var(--danger); }
  .btn.picked { border-color: var(--gold); }
  #celebrate.big .card { border-color: var(--gold); }
  #celebrate.big h2 { color: var(--gold); }

  .board { list-style: none; margin: 0 0 8px; padding: 0; text-align: start; }
  .board li {
    display: flex; align-items: center; gap: 10px; padding: 12px 10px;
    border-bottom: 1px solid var(--line);
  }
  .board .rank { width: 30px; text-align: center; font-size: 20px; font-weight: 800; color: var(--muted); }
  .board .pname { flex: 1; font-size: 18px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .stats { display: flex; gap: 10px; font-size: 15px; color: var(--muted); white-space: nowrap; }
  .board .stats b { color: var(--text); }
  .board .stats .c b { color: var(--gold); font-size: 18px; }
  .board .edit { font-size: 18px; padding: 6px; }
  .legend { font-size: 13px; color: var(--muted); margin-bottom: 4px; }

  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 11; }
  .confetti span { position: absolute; top: -40px; font-size: 28px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
</style>
</head>
<body>

<main id="court"></main>

<nav id="bar">
  <button id="undo">↶ تراجع</button>
  <button data-open="board">🏆 الترتيب</button>
  <button data-open="menu">⋯</button>
</nav>

<div id="toast"></div>

<div class="overlay" id="celebrate">
  <div class="card">
    <div class="big-emoji" id="celEmoji"></div>
    <h2 id="celTitle"></h2>
    <p id="celText"></p>
    <button class="btn primary" data-close>كمّلوا 🏓</button>
  </div>
</div>

<div class="overlay" id="board">
  <div class="card">
    <h2>🏆 الترتيب</h2>
    <div class="legend">🏆 خمسات كبيرة · ⭐ خمسات صغيرة · 🏓 دقوق</div>
    <ol class="board" id="boardList"></ol>
    <button class="btn" data-action="add">➕ لاعب جديد</button>
    <button class="btn primary" data-close>رجوع</button>
  </div>
</div>

<div class="overlay" id="picker">
  <div class="card">
    <h2>مين بيلعب؟</h2>
    <div id="pickList"></div>
    <button class="btn" data-action="add-pick">➕ لاعب جديد</button>
    <button class="btn primary" data-close>رجوع</button>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <h2>القائمة</h2>
    <p>٣ دقوق = خمسة صغيرة ⭐ · ٣ خمسات صغيرة = خمسة كبيرة 🏆</p>
    <button class="btn" data-action="reset-match">صفّر الماتش الحالي (الكؤوس بتضل)</button>
    <button class="btn danger" data-action="wipe">امسح كل شي</button>
    <button class="btn primary" data-close>رجوع</button>
  </div>
</div>

<script>
'use strict';

// No points: after each game you tap who won it. First to 3 games takes a
// "small five"; first to 3 small fives takes the "big five" — the cup.
const TO_WIN = 3;
const KEY = 'pingpong.v2';
const OLD_KEY = 'pingpong.v1';
const HISTORY_CAP = 300;

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const newPlayer = (name, bigs = 0) => ({ id: newId(), name, bigs, smalls: 0, games: 0 });

function fresh() {
  const a = newPlayer('لاعب ١'), b = newPlayer('لاعب ٢');
  return { players: [a, b], slots: [a.id, b.id], matches: {} };
}

// The first version counted points; keep its names and cups.
function fromV1(old) {
  const s = fresh();
  s.players.forEach((p, i) => { p.name = old.names?.[i] || p.name; p.bigs = old.bigs?.[i] || 0; });
  return s;
}

let state, history;
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved) ({ state, history } = saved);
  else {
    const old = JSON.parse(localStorage.getItem(OLD_KEY));
    state = old?.state ? fromV1(old.state) : fresh();
    history = [];
  }
} catch { state = fresh(); history = []; }

const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify({ state, history })); } catch {}
};
const snapshot = () => {
  history.push(JSON.stringify(state));
  if (history.length > HISTORY_CAP) history.shift();
};

const player = (id) => state.players.find((p) => p.id === id);

// Progress is kept per pair, so switching opponents and back resumes where you were.
function match() {
  const [a, b] = state.slots;
  const key = [a, b].sort().join('|');
  return (state.matches[key] ||= { games: { [a]: 0, [b]: 0 }, smalls: { [a]: 0, [b]: 0 } });
}

function winGame(slot) {
  snapshot();
  const w = state.slots[slot], l = state.slots[1 - slot];
  const m = match(), pw = player(w);
  m.games[w]++; pw.games++;
  let result = { level: 'game', score: [m.games[w], m.games[l]] };

  if (m.games[w] >= TO_WIN) {
    result = { level: 'small', score: [m.games[w], m.games[l]] };
    m.games = { [w]: 0, [l]: 0 };
    m.smalls[w]++; pw.smalls++;

    if (m.smalls[w] >= TO_WIN) {
      result = { level: 'big', score: [m.smalls[w], m.smalls[l]] };
      m.smalls = { [w]: 0, [l]: 0 };
      pw.bigs++;
    }
  }

  save();
  render();
  announce(pw, result);
}

function undo() {
  if (!history.length) return;
  state = JSON.parse(history.pop());
  hide('celebrate');
  save();
  render();
  toast('↶ رجعنا خطوة');
}

// ---------- rendering ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const marks = (n, on, off) => Array.from({ length: TO_WIN }, (_, i) => (i < n ? on : off)).join('');

function sideHTML(slot) {
  const id = state.slots[slot], p = player(id), m = match();
  return `
    <section class="side" data-slot="${slot}">
      <div class="who">
        <button class="name" data-action="pick" data-slot="${slot}"><span>${esc(p.name)}</span><small>▾</small></button>
        <span class="cups">🏆 ${p.bigs}</span>
      </div>
      <div class="progress">
        <div class="row"><span class="label">دقوق</span>${marks(m.games[id], '<span class="dot on"></span>', '<span class="dot"></span>')}</div>
        <div class="row"><span class="label">صغيرة</span>${marks(m.smalls[id], '<span class="star on">★</span>', '<span class="star">★</span>')}</div>
      </div>
      <button class="win" data-action="win" data-slot="${slot}">فاز بالدق ✓</button>
    </section>`;
}

const ranked = () => [...state.players].sort((a, b) => b.bigs - a.bigs || b.smalls - a.smalls || b.games - a.games);

function render() {
  $('court').innerHTML = sideHTML(0) + sideHTML(1);
  $('undo').disabled = !history.length;

  const medals = ['🥇', '🥈', '🥉'];
  $('boardList').innerHTML = ranked().map((p, i) => `
    <li>
      <span class="rank">${medals[i] ?? i + 1}</span>
      <span class="pname">${esc(p.name)}</span>
      <span class="stats"><span class="c">🏆 <b>${p.bigs}</b></span><span>⭐ <b>${p.smalls}</b></span><span>🏓 <b>${p.games}</b></span></span>
      <button class="edit" data-action="edit" data-id="${p.id}">✏️</button>
    </li>`).join('');

  $('pickList').innerHTML = ranked().map((p) => `
    <button class="btn ${state.slots.includes(p.id) ? 'picked' : ''}" data-action="choose" data-id="${p.id}">${esc(p.name)} · 🏆 ${p.bigs}</button>`).join('');
}

let toastTimer;
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function announce(p, { level, score }) {
  const s = `${score[0]} – ${score[1]}`;
  if (level === 'game') return toast(`✅ ${p.name} ربح الدق · ${s}`);
  const [emoji, title, text] = level === 'small'
    ? ['⭐', `${p.name} ربح خمسة صغيرة!`, `الدقوق ${s}`]
    : ['🏆', `${p.name} ربح الخمسة الكبيرة!`, `الخمسات الصغيرة ${s} · الكؤوس: ${p.bigs}`];
  $('celEmoji').textContent = emoji;
  $('celTitle').textContent = title;
  $('celText').textContent = text;
  $('celebrate').classList.toggle('big', level === 'big');
  show('celebrate');
  confetti(level === 'big' ? 70 : 25);
}

function confetti(n) {
  const box = document.createElement('div');
  box.className = 'confetti';
  const bits = ['🎉', '🏓', '⭐', '🏆', '✨'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.textContent = bits[i % bits.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
    s.style.animationDelay = Math.random() * .6 + 's';
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4000);
}

const show = (id) => $(id).classList.add('show');
const hide = (id) => $(id).classList.remove('show');

function askName(current = '') {
  const v = prompt('شو الاسم؟', current);
  return v && v.trim() ? v.trim().slice(0, 20) : null;
}

function addPlayer() {
  const name = askName();
  if (!name) return null;
  snapshot();
  const p = newPlayer(name);
  state.players.push(p);
  save(); render();
  return p;
}

let pickingSlot = 0;
function choose(id) {
  snapshot();
  const other = 1 - pickingSlot;
  // Picking the opponent just swaps the two sides.
  if (state.slots[other] === id) state.slots[other] = state.slots[pickingSlot];
  state.slots[pickingSlot] = id;
  save(); render(); hide('picker');
}

function editPlayer(id) {
  const p = player(id);
  const action = prompt(`${p.name}\nاكتب اسم جديد، أو اكتب "امسح" لتمسحه`, p.name);
  if (!action || !action.trim() || action.trim() === p.name) return;
  if (action.trim() === 'امسح') {
    if (state.slots.includes(id)) return alert('هاد عم يلعب هلق. بدّله بالماتش أول وبعدين امسحه.');
    if (!confirm(`أكيد بدك تمسح ${p.name} مع كؤوسه؟`)) return;
    snapshot();
    state.players = state.players.filter((x) => x.id !== id);
    for (const k of Object.keys(state.matches)) if (k.split('|').includes(id)) delete state.matches[k];
  } else {
    snapshot();
    p.name = action.trim().slice(0, 20);
  }
  save(); render();
}

// ---------- events ----------
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action], [data-open], [data-close]');
  if (!el) return;
  if (el.dataset.open) return show(el.dataset.open);
  if (el.hasAttribute('data-close')) return hide(el.closest('.overlay').id);

  switch (el.dataset.action) {
    case 'win': return winGame(+el.dataset.slot);
    case 'pick': pickingSlot = +el.dataset.slot; return show('picker');
    case 'choose': return choose(el.dataset.id);
    case 'add': return addPlayer();
    case 'add-pick': { const p = addPlayer(); if (p) choose(p.id); return; }
    case 'edit': return editPlayer(el.dataset.id);
    case 'reset-match': {
      if (!confirm('نصفّر الدقوق والخمسات الصغيرة بين هالاتنين؟ الكؤوس والترتيب بيضلوا.')) return;
      snapshot();
      const [a, b] = state.slots;
      state.matches[[a, b].sort().join('|')] = { games: { [a]: 0, [b]: 0 }, smalls: { [a]: 0, [b]: 0 } };
      save(); render(); return hide('menu');
    }
    case 'wipe': {
      if (!confirm('أكيد؟ رح ينمسح كل شي: اللاعبين والكؤوس والترتيب.')) return;
      state = fresh(); history = [];
      save(); render(); return hide('menu');
    }
  }
});
$('undo').onclick = undo;

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

render();
</script>
</body>
</html>
